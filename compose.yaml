# Local MySQL infrastructure only. Bryson owns migrations and domain tables.
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-popssibilities_dev}
      MYSQL_USER: ${DB_USER:?Set DB_USER in your private root .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your private root .env}
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_dev_data:
