# Example HTTPS site: replace the origin, certificate paths and frontend root.
# Keep Flask/Gunicorn bound to 127.0.0.1:5000; set AUTH_TRUSTED_PROXY_HOPS=1.
# This log format deliberately excludes query strings and request headers.
log_format auth_safe '$remote_addr $request_method $uri $server_protocol $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name site.example.invalid;
    access_log /var/log/nginx/popssibilities-access.log auth_safe;
    return 308 https://site.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name site.example.invalid;
    ssl_certificate /etc/letsencrypt/live/site.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/popssibilities/frontend/dist;

    access_log /var/log/nginx/popssibilities-access.log auth_safe;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/v1/ {
        # Proxy errors can include the entire callback query. Application errors
        # and audit records provide safe diagnostics instead of retaining it.
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
