<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <g
    stroke="#4b004b"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Background Sunburst Accent -->
    <path
      d="M70 12v-6m41 17 5-5m17 41h6M28 23l-5-5M12 59H6"
      stroke="#ffcf4b"
      stroke-width="3"
    />

    <!-- Melted Puddle at Base -->
    <path
      d="M30 120c-8 0-14 3-14 6s10 7 26 7h56c18 0 28-3 28-7s-10-6-22-6c-6 0-9 2-16 2s-12-2-20-2c-9 0-14 2-20 2s-8-2-18-2Z"
      fill="#ffcf4b"
    />
    <ellipse cx="106" cy="127" rx="7" ry="3" fill="#da2935" stroke="none" />

    <!-- Paleta Wooden Stick -->
    <rect
      x="61"
      y="84"
      width="18"
      height="38"
      rx="9"
      fill="#dfb37b"
      transform="rotate(3 70 103)"
    />

    <!-- Paleta Body (Strawberry Red Top) -->
    <path
      d="M39 42c0-18 14-30 31-30s31 12 31 30v44c0 8-5 13-14 13H53c-9 0-14-5-14-13Z"
      fill="#da2935"
      transform="rotate(2 70 56)"
    />

    <!-- Wavy Mango Layer (Yellow Bottom) -->
    <path
      d="M39 58c10-11 18 11 31 0s20 10 31 0v28c0 8-5 13-14 13H53c-9 0-14-5-14-13Z"
      fill="#ffcf4b"
      transform="rotate(2 70 70)"
    />

    <!-- Glossy Shine -->
    <path d="M52 38c0-9 6-15 14-16" stroke="#fff3d8" stroke-width="5" />

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="53" cy="62" rx="4" ry="2" fill="#ff59a5" stroke="none" />
    <ellipse cx="89" cy="64" rx="4" ry="2" fill="#ff59a5" stroke="none" />

    <!-- Cool Retro Sunglasses (Tilted quizzically) -->
    <g transform="rotate(-3 70 50)">
      <!-- Left Lens Frame & Glass -->
      <rect
        x="47"
        y="42"
        width="20"
        height="15"
        rx="6"
        fill="#35162f"
        stroke="#4b004b"
        stroke-width="3"
      />
      <!-- Left Lens Glare Lines -->
      <path
        d="M51 46l4 7m2-7l4 7"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linecap="round"
      />

      <!-- Sunglasses Bridge -->
      <path d="M67 48h8" stroke="#4b004b" stroke-width="3" />

      <!-- Right Lens Frame & Glass -->
      <rect
        x="75"
        y="43"
        width="20"
        height="15"
        rx="6"
        fill="#35162f"
        stroke="#4b004b"
        stroke-width="3"
      />
      <!-- Right Lens Glare Lines -->
      <path
        d="M79 47l4 7m2-7l4 7"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linecap="round"
      />

      <!-- Glasses Temples (Arms extending slightly) -->
      <path d="M47 48l-6 1m54-2l6 1" stroke="#4b004b" stroke-width="2.5" />
    </g>

    <!-- Cocked Eyebrow above Right Lens -->
    <path d="M78 36c4-3 9-1 12 1" stroke="#4b004b" stroke-width="2.5" />

    <!-- Smirking / Cool Wry Mouth -->
    <path d="M67 65c3 3 8 2 11-1" stroke="#4b004b" stroke-width="2.5" />

    <!-- Melting Drip on Side -->
    <path
      d="M102 74c0 5 4 7 4 12a4 4 0 0 1-8 0c0-5 4-7 4-12Z"
      fill="#da2935"
      stroke="#4b004b"
      stroke-width="2.5"
    />

    <!-- Little Falling Drip -->
    <circle cx="106" cy="104" r="3" fill="#da2935" stroke="#4b004b" stroke-width="2" />

    <!-- Sparkles -->
    <path d="m18 42 6 3m92-10 6-3m-8 42 7 2" />
  </g>
</svg>
