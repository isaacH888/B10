name: Shared foundation checks

"on":
  push:
  pull_request:
  workflow_dispatch:

# This workflow validates changes; it has no deployment permissions or steps.
permissions:
  contents: read

jobs:
  foundation:
    name: Contract and backend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        # Disposable CI credentials only; never reuse them outside this runner.
        env:
          MYSQL_ROOT_PASSWORD: foundation_ci_root_only
          MYSQL_DATABASE: popssibilities_ci
          MYSQL_USER: foundation_ci
          MYSQL_PASSWORD: foundation_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfoundation_ci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check_foundation.py
      - name: Apply authentication migrations to disposable MySQL
        run: python -m app.migrations
        working-directory: backend
        env:
          APP_ENV: development
          AUTH_ENABLED: "false"
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: popssibilities_ci
          DB_USER: foundation_ci
          DB_PASSWORD: foundation_ci_only
      - run: python -m pytest -c backend/pytest.ini -q
        env:
          APP_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: popssibilities_ci
          DB_USER: foundation_ci
          DB_PASSWORD: foundation_ci_only
          RUN_DATABASE_INTEGRATION: "1"

  frontend:
    name: Frontend scaffold build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1

  cognito-template:
    name: Cognito configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install cfn-lint==1.57.2
      - run: cfn-lint infra/cognito-authentication.json infra/customer-test-email.json
